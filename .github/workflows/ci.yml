name: AeternaCore Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  biostat-verification:
    name: Verify Biostatistical & ISO 15189 Engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Biostatistical, LIS & FHIR Determinism Tests
        run: node --test --test-reporter=spec tests/engine.test.mjs
